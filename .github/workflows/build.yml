name: Build and Release

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  unit_tests:
    name: Unit tests
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Run core tests
      run: swift test 2>&1 | tail -20

  build_arm64:
    name: Build arm64
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Show Build Environment
      run: |
        xcodebuild -version
        swift --version
        uname -m
        echo "Available schemes:"
        xcodebuild -list -project Moonlight.xcodeproj || true

    - name: Download XCFrameworks
      run: |
        curl -L -o xcframeworks.zip "https://github.com/coofdy/moonlight-mobile-deps/releases/download/latest/moonlight-apple-xcframeworks.zip"
        unzip -o xcframeworks.zip -d xcframeworks/
        ls -la xcframeworks/

    - name: Build Apple Silicon package
      run: |
        xcodebuild -project Moonlight.xcodeproj \
          -scheme "Moonlight for macOS" \
          -configuration Release \
          -derivedDataPath build \
          -destination "platform=macOS,arch=arm64" \
          ARCHS="arm64" \
          ONLY_ACTIVE_ARCH=YES \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          BUILD_NUMBER=${{ github.run_number }} \
          build

    - name: Verify arm64 binary slices
      run: |
        main_binary="build/Build/Products/Release/Moonlight.app/Contents/MacOS/Moonlight"
        helper_binary="build/Build/Products/Release/Moonlight.app/Contents/Library/LaunchServices/std.skyhua.MoonlightMac.AwdlPrivilegedHelper"

        lipo -info "$main_binary"
        file "$main_binary"

        if [ ! -f "$helper_binary" ]; then
          echo "Expected AWDL helper at $helper_binary"
          exit 1
        fi

        lipo -info "$helper_binary"
        file "$helper_binary"

        main_archs="$(lipo -archs "$main_binary")"
        helper_archs="$(lipo -archs "$helper_binary")"
        echo "Main binary architectures: $main_archs"
        echo "Helper binary architectures: $helper_archs"

        if [[ "$main_archs" != *"arm64"* ]]; then
          echo "Main binary missing expected architecture arm64"
          exit 1
        fi

        if [[ "$helper_archs" != *"arm64"* ]]; then
          echo "Helper binary missing expected architecture arm64"
          exit 1
        fi

    - name: Package arm64 app bundle
      run: |
        mkdir -p dist/app
        cp -R "build/Build/Products/Release/Moonlight.app" "dist/app/Moonlight.app"
        tar -czf "dist/Moonlight-macOS-arm64.app.tar.gz" -C dist/app Moonlight.app

    - name: Create arm64 DMG
      run: |
        brew install create-dmg || true

        create-dmg \
          --volname "Moonlight macOS Enhanced (arm64)" \
          --volicon "dist/app/Moonlight.app/Contents/Resources/AppIcon.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "Moonlight.app" 150 185 \
          --hide-extension "Moonlight.app" \
          --app-drop-link 450 185 \
          "dist/Moonlight-macOS-Enhanced-arm64.dmg" \
          "dist/app/Moonlight.app" || \
        hdiutil create -volname "Moonlight-arm64" -srcfolder "dist/app/Moonlight.app" -ov -format UDZO "dist/Moonlight-macOS-Enhanced-arm64.dmg"

    - name: Upload arm64 app artifact
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-app-arm64
        path: dist/Moonlight-macOS-arm64.app.tar.gz
        if-no-files-found: error

    - name: Upload arm64 DMG artifact
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-dmg-arm64
        path: dist/Moonlight-macOS-Enhanced-arm64.dmg
        if-no-files-found: error

  build:
    name: build
    needs: [unit_tests, build_arm64]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Verify required build jobs
      run: |
        echo "unit_tests result: ${{ needs.unit_tests.result }}"
        echo "build_arm64 result: ${{ needs.build_arm64.result }}"

        if [ "${{ needs.unit_tests.result }}" != "success" ]; then
          echo "unit_tests did not succeed"
          exit 1
        fi

        if [ "${{ needs.build_arm64.result }}" != "success" ]; then
          echo "build_arm64 did not succeed"
          exit 1
        fi

        echo "All required build jobs passed."

  release:
    needs: [build_arm64, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download arm64 DMG artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-dmg-arm64
        path: dist

    - name: Get Version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

    - name: Build Release Body
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python3 .github/scripts/build_release_body.py

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        files: |
          dist/Moonlight-macOS-Enhanced-arm64.dmg
        body_path: release_body.md
